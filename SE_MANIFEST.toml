# ============================================================
# SE_MANIFEST.toml (Repository Declaration)
# ============================================================

schema = "se-manifest-schema"
schema_version = "0.5.2"
schema_url = "https://raw.githubusercontent.com/structural-explainability/se-manifest-schema/main/manifest-schema.toml"

# === Framework Context ===

[meta]
framework = "Structural Explainability"
framework_url = "https://github.com/structural-explainability"
purpose = "Declares this repository's role in the Structural Explainability ecosystem."

# === Repository Identity ===

[repository]
organization = "structural-explainability"
name = "se-verification-operational-identity"
class = "verification"
kind = "verification"
status = "active"
since = "2026"
summary = "Provides executable evidence that the finite audit of Paper 210, Operational Identity, is implemented as the paper defines it, using independent derivations, paper-case regressions, property checks, and Lean conformance vectors."
# === Layer Position ===

[layer]
space = "research"
role = "verification"

# === Dependency Declarations ===

[depends]
required = [
    { repository = "paper-210-operational-identity", kind = "semantic", reason = "Defines the finite audit, its definitions, propositions, and examples that this repository checks." },
]
optional = [
    { repository = "se-theory-operational-identity", kind = "semantic", reason = "Lean 4 formalization that checks the generated conformance vectors with its own definitions." },
]

# === Provided Artifacts ===

[provides]
artifacts = ["src/se_verification_operational_identity", "tests", "README.md"]

# === Validation ===

[validation]
entrypoint = "uv run pytest"
strict_entrypoint = "uv run se-verification-operational-identity --random 20000 --seed 0"

# === Scope ===

[scope]
includes = [
    "oracle, fast, and edge-characterization derivations of the audit that share only data classes",
    "declared relations supplied as partitions or generated from individually licensed steps",
    "audits relative to a supplied alternative relation",
    "substitution with a divergence witness and substitution with a pass",
    "three-valued verdicts under explicit warrants, surface control, and computability",
    "store composition and the joint surface",
    "exhaustive partition sweeps and licence sweeps over small domains",
    "randomized differential testing with branch coverage reporting",
    "property checks for the paper's propositions",
    "paper-case regressions tagged with paper labels",
    "seeded faults in one checker and in both",
    "operation counts for the closure step as supporting evidence",
    "generated Lean conformance vectors",
]

excludes = [
    "discovery of identity-relevant mechanisms in deployed systems",
    "empirical evaluation of a deployed record system",
    "proof of registry completeness",
    "proof of evaluated-surface completeness",
    "proof of identified-use completeness",
    "selection of the normatively correct identity regime",
    "legal, causal, or institutional conclusions",
    "proof of the asymptotic bound of the decidability theorem",
    "proof that the implementations match the paper",
]

# === Naming ===

[naming]
pattern = "se-verification-*"

# === Governance ===

[governance]
authority = "structural-explainability"

# === Citation ===

[citation]
cff = "CITATION.cff"
preferred = "CITATION.cff"

# === Traceability ===

[traceability]
identifier_map = "none"
